<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chandling Requests – Admin Console</title>
  <link rel="stylesheet" href="../css/portal.css">
</head>

<body class="so-body so-body-admin">

<div class="so-layout-wrapper">

  <aside id="sidebar" class="so-sidebar">
    <div class="so-sidebar-header">
      <img src="../assets/logo/logo.png" class="so-logo">
      <h2 class="so-logo-text">Admin Console</h2>
    </div>

    <nav class="so-nav">
      <a href="./dashboard.html" class="so-nav-link">📦 Shipments</a>
      <a href="./preorders.html" class="so-nav-link">🛒 Preorders</a>
      <a href="./chandling.html" class="so-nav-link so-nav-link-active">⚓ Chandling</a>
    </nav>

    <div class="so-sidebar-footer">
      <button id="adminLogout" class="so-btn so-btn-outline">Log Out</button>
    </div>
  </aside>

  <div class="so-layout">
    <header class="so-topbar">
      <button id="menuToggle" class="so-icon-btn so-topbar-burger">☰</button>

      <div class="so-topbar-title">
        <h1>Chandling Requests</h1>
        <p class="so-topbar-subtitle">Incoming ship supply requests</p>
      </div>
    </header>

    <main class="so-main">
      <section class="so-section">
        <div class="so-card so-card-panel">
          <h2>All Requests</h2>

          <div class="so-table-wrapper">
            <table class="so-table">
              <thead>
                <tr>
                  <th>Vessel</th>
                  <th>Call Sign</th>
                  <th>Port</th>
                  <th>ETA</th>
                  <th>Status</th>
                </tr>
              </thead>

              <tbody id="chandlingBody">
                <tr><td colspan="5" class="so-table-empty">Loading…</td></tr>
              </tbody>
            </table>
          </div>

        </div>
      </section>
    </main>
  </div>

</div>

<script type="module" src="../js/admin-chandling.js"></script>

</body>
</html>

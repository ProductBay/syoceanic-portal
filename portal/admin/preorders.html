<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preorders – Admin Console</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/portal.css">
</head>
<script>
  console.log("CURRENT URL:", window.location.href);
  console.log("SCRIPT TRYING TO LOAD:", new URL("../js/admin-preorders.js", window.location.href).href);
</script>

<body class="so-body so-body-admin">

  <div class="so-layout-wrapper">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="so-sidebar">
      <div class="so-sidebar-header">
        <img src="../assets/logo/logo.png" class="so-logo">
        <h2 class="so-logo-text">Admin Console</h2>
      </div>

        <nav class="so-nav">
        <a href="./dashboard.html" class="so-nav-link so-nav-link-active">📦 Shipments</a>
        <a href="./add-shipment.html" class="so-nav-link">➕ Add Shipment</a>
        <a href="./preorders.html" class="so-nav-link">🛒 Preorders</a>
        <a href="./chandling.html" class="so-nav-link ">⚓ Chandling</a>
        <a href="./settings.html" class="so-nav-link">⚙️ Settings</a>
        <a href="./users.html" class="so-nav-link">👥 Users</a>
        <a href="./reports.html" class="so-nav-link">📊 Reports</a>
        <a href="./logs.html" class="so-nav-link">📝 Logs</a>
      </nav>

      <div class="so-sidebar-footer">
        <button id="adminLogout" class="so-btn so-btn-outline">Log Out</button>
      </div>
    </aside>



    <!-- MAIN LAYOUT -->
    <div class="so-layout">

      <!-- TOP BAR -->
      <header class="so-topbar">
        <button id="menuToggle" class="so-icon-btn so-topbar-burger">☰</button>

        <div class="so-topbar-title">
          <h1>Preorders</h1>
          <p class="so-topbar-subtitle">Manage all customer preorders</p>
        </div>

        <div class="so-topbar-right">
          <div id="profileMenuBtn" class="so-topbar-profile">
            <div id="adminEmailLabel" class="so-topbar-email">admin@example.com</div>
            <div id="adminAvatar" class="so-user-avatar">A</div>
          </div>

          <div id="profileDropdown" class="so-dropdown hidden">
            <div class="so-dropdown-email" id="adminDropdownEmail">admin@example.com</div>

            <a href="./settings.html" class="so-dropdown-item">⚙️ Settings</a>
            <button id="adminLogout" class="so-dropdown-item so-dropdown-logout">🚪 Log Out</button>
          </div>
        </div>
      </header>



      <!-- MAIN CONTENT -->
      <main class="so-main">

        <section class="so-section">

          <div class="so-card so-card-panel">
            <h2>All Preorders</h2>

            <div class="so-table-wrapper">
              <table class="so-table">
                <thead>
                  <tr>
                    <th>Customer</th>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Shipping</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th></th>
                  </tr>
                </thead>

                <tbody id="preordersBody">
                  <tr><td colspan="7" class="so-table-empty">Loading…</td></tr>
                </tbody>

              </table>
            </div>

          </div>
        </section>

      </main>
    </div>

  </div>



  <!-- VIEW / EDIT PREORDER MODAL -->
  <div id="preorderModal" class="so-modal">
    <div class="so-modal-content" style="max-width:600px">

      <button id="preorderClose" class="so-modal-close">×</button>
      <h2>Preorder Details</h2>

      <div id="preorderDetails" class="so-form">
        <!-- JS will insert details -->
      </div>

      <div class="so-modal-footer">
        <button id="savePreorder" class="so-btn so-btn-full">Save Changes</button>
      </div>

    </div>
  </div>

  <div id="adminAlert" class="so-alert-floating"></div>
<script>
  console.log("INLINE TEST SCRIPT RAN!");
</script>

 <script type="module" src="../js/admin-preorders.js"></script>

</body>
</html>
